name: Quality and Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
  windows-artifacts:
    name: Windows packaged smoke and unsigned installers
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run package:win
      - name: Smoke unpacked, portable and installed Windows executables
        shell: pwsh
        run: ./scripts/windows-smoke.ps1
      - name: List SHA-256 checksums
        shell: pwsh
        run: Get-ChildItem release/*.exe | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize
      - uses: actions/upload-artifact@v4
        with:
          name: ryven-windows-unsigned
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

  linux-packaged-smoke:
    name: Linux packaged renderer / preload / SQLite smoke
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --linux dir --x64 --publish never
      - name: Smoke packaged Linux executable
        run: |
          export RYVEN_SMOKE_TEST=1
          export RYVEN_SMOKE_REPORT="$RUNNER_TEMP/ryven-smoke.json"
          timeout 90s xvfb-run -a release/linux-unpacked/ryven --no-sandbox
          python3 -c 'import json,os; x=json.load(open(os.environ["RYVEN_SMOKE_REPORT"])); assert x["ok"] and x["mounted"] and x["preload"] and x["platform"]=="linux"; print(x)'
